<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOOP — Tech • Finance • Innovation</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="page-fade" data-page="home">

  <!-- NAVBAR -->
  <nav class="navbar glass">
    <h2>THE LOOP</h2>
    <div class="nav-links">
      <a href="index.html" class="active">Home</a>
      <a href="articles.html">Articles</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <!-- HEADER / HERO -->
  <header class="hero">
    <h4>Explore the future with</h4>
    <h1>THE LOOP</h1>
    <p>What's happening right now.</p>
    <button id="themeToggle">🌙</button>
  </header>

  <!-- SEARCH BAR -->
  <section class="search-section">
    <input id="search" placeholder="Search articles..." />
  </section>

  <!-- CATEGORY FILTERS -->
  <section class="filter-section">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="Technology">Technology</button>
    <button class="filter-btn" data-category="Finance">Finance</button>
    <button class="filter-btn" data-category="Innovation">Innovation</button>
  </section>

  <!-- SORTING -->
  <section class="sort-section">
    <label for="sort">Sort by:</label>
    <select id="sort">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </section>

  <!-- FEATURED ARTICLE -->
  <section id="featured" class="featured-section"></section>

  <!-- ARTICLE GRID -->
  <main id="articles"></main>

  <!-- ARTICLE DETAIL MODAL -->
  <div id="articleModal" class="modal">
    <div class="modal-content">
      <span id="modalClose" class="modal-close">&times;</span>
      <img id="modalImage" />
      <h2 id="modalTitle"></h2>
      <p id="modalCategory"></p>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- INFINITE SCROLL LOADER (hidden on home by JS) -->
  <div id="infiniteLoader" class="infinite-loader">Loading more articles...</div>

  <!-- SCROLL TO TOP BUTTON -->
  <button id="scrollTop">↑</button>

  <!-- FOOTER -->
  <footer class="loop-footer">
    <div class="footer-content">
      <h3>THE LOOP</h3>
      <p>Technology • Finance • Innovation</p>

      <div class="footer-icons">
        <!-- Instagram -->
        <a href="https://www.instagram.com/?hl=en" class="footer-icon" aria-label="Instagram">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M4 4H8V20H4V4ZM10 9H14V11C14.6 10 16 9 18 9C21 9 22 11 22 14V20H18V15C18 13.5 17.5 13 16.5 13C15.5 13 15 13.7 15 15V20H11V9H10Z" 
                  fill="currentColor"/>
          </svg>
        </a>
    </div>
  </div>

  <p class="footer-copy">© 2026 THE LOOP — All Rights Reserved</p>
</footer>

  <script src="script.min.js"></script>
</body>
</html>
