<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Articles — THE LOOP</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="page-fade" data-page="articles">

  <!-- NAVBAR -->
  <nav class="navbar glass">
    <h2>THE LOOP</h2>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="articles.html" class="active">Articles</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <header class="hero small-hero">
    <h1>Articles</h1>
    <p>Every newsletter, all in one place.</p>
    <button id="themeToggle">🌙</button>
  </header>

  <!-- SEARCH -->
  <section class="search-section">
    <input id="search" placeholder="Search articles..." />
  </section>

  <!-- CATEGORY FILTERS -->
  <section class="filter-section">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="Technology">Technology</button>
    <button class="filter-btn" data-category="Finance">Finance</button>
    <button class="filter-btn" data-category="Innovation">Innovation</button>
  </section>

  <!-- SORTING -->
  <section class="sort-section">
    <label for="sort">Sort by:</label>
    <select id="sort">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </section>
  

  <!-- FEATURED ARTICLE -->
  <section id="featured" class="featured-section"></section>

  <!-- ARTICLE GRID -->
  <main id="articles"></main>

  <!-- ARTICLE DETAIL MODAL -->
  <div id="articleModal" class="modal">
    <div class="modal-content">
      <span id="modalClose" class="modal-close">&times;</span>
      <img id="modalImage" />
      <h2 id="modalTitle"></h2>
      <p id="modalCategory"></p>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- INFINITE SCROLL LOADER -->
  <div id="infiniteLoader" class="infinite-loader">Loading more articles...</div>

  <!-- SCROLL TO TOP BUTTON -->
  <button id="scrollTop">↑</button>

  <!-- FOOTER -->
  <footer class="loop-footer">
    <div class="footer-content">
      <h3>LOOP</h3>
      <p>Technology • Finance • Innovation</p>

      <div class="footer-icons">
        <a href="https://www.instagram.com/theloop" class="footer-icon" aria-label="Instagram" target="_blank">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M7 2C4.2 2 2 4.2 2 7V17C2 19.8 4.2 22 7 22H17C19.8 22 22 19.8 22 17V7C22 4.2 19.8 2 17 2H7ZM12 7C14.8 7 17 9.2 17 12C17 14.8 14.8 17 12 17C9.2 17 7 14.8 7 12C7 9.2 9.2 7 12 7ZM18 6.5C18 7.3 17.3 8 16.5 8C15.7 
            fill="currentColor"/>
          </svg>
        </a>
      </div>
    </div>

    <p class="footer-copy">©
    2026 LOOP — All Rights Reserved</p>

  <script src="script.min.js"></script>
</body>
</html>
